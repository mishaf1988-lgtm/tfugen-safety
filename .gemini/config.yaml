# Gemini Code Assist ב-GitHub (23/11/2026, מיכאל בשאלון: "הייתי רוצה חיבור לגימיני").
# ביקורת ידנית בלבד: אין ביקורת, סיכום או עזרה אוטומטיים בפתיחת PR.
# מפעילים ב-PR ספציפי על ידי תגובה: /gemini review
# נוסף ללא הפעלה: זה לא עושה כלום עד שמיכאל מתקין את אפליקציית Gemini Code Assist על המאגר.
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: 10
  pull_request_opened:
    help: false
    summary: false
    code_review: false
    include_drafts: false
