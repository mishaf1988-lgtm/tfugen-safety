# Golden questions of the assistant as a promptfoo suite (experiment, 03/11/2026; STATUS "three experiments from GitHub tools").
# The judge is the same code as tools/golden-check.py, imported, so the two can never disagree.
# Run from the repo root:  ANSWERS=<answers.json> npx promptfoo@0.125.1 eval -c project-files/research/promptfoo-golden/promptfooconfig.yaml
# ANSWERS = {"g1": "<answer>", ...} collected from the office (assistant-golden.md step 2). No model is called.
description: golden questions of the assistant
prompts:
  - "{{q}}"
providers:
  - id: file://replay.py
    label: replay
tests: file://tests.json
defaultTest:
  assert:
    - type: python
      value: file://judge.py:gold
      metric: gold
    - type: python
      value: file://judge.py:hebrew
      metric: hebrew
