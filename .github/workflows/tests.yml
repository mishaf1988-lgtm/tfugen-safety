# The harness on every PR to main and every push to main (upgrade review 28;
# Michael, 01/10/2026: "yes, four groups in parallel"). Until now the tests ran
# only when Claude remembered to run them (#994 went in red).
#
# Four shards of tests/harness/run.sh in parallel (SHARD=i/4), about 2-3
# minutes instead of 7. A change that touches only .md files skips them. The
# one check to require on main is "tests": it is green only when every shard
# passed, or when nothing but documentation changed. The repo is public, so
# Actions minutes cost nothing. .claude/hooks/merge-gate.py reads the same
# check before Claude may merge.
name: tests

on:
  pull_request:
    branches: [main]
    # edited: a title or description change re-runs the lessons gate
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null || [ "$base" = "0000000000000000000000000000000000000000" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # quotepath=off: a Hebrew file name otherwise comes back quoted with \327... and
          # never matches \.md$ (#1009 ran every shard for a handoff file).
          files=$(git -c core.quotepath=off diff --name-only "$base" HEAD)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qv '\.md$'; then echo "code=false" >> "$GITHUB_OUTPUT"; else echo "code=true" >> "$GITHUB_OUTPUT"; fi

  # A fix PR must carry its lesson (Michael, 01/10/2026). Title and body go in
  # through env, never into the script text: PR text is untrusted input.
  lessons:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git -c core.quotepath=off diff --name-only "$BASE" HEAD | python3 .github/scripts/lessons-gate.py
      # Here and not only in the harness: a PR of .md only (a new lesson) skips the
      # harness, and a broken lessons file then failed the next code PR (retro 01/10/2026).
      - run: python3 tests/harness/lessons-format-test.py
      # Same reason: a STATUS-only PR skips the harness, and a stale open item
      # that the archive already closed is exactly what such a PR adds (lesson 15).
      - run: python3 tests/harness/status-dup-test.py
      # A handoff PR is .md only too (CLAUDE.md: only the latest handoff in the root).
      - run: python3 tests/harness/handoff-root-test.py
      # CLAUDE.md rule 7 on the lines this PR adds (a STATUS PR is .md only and skips the harness).
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git -c core.quotepath=off diff -U0 "$BASE" HEAD -- STATUS.md project-files/STATUS-archive.md | python3 .github/scripts/rule7-gate.py

  harness:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The same playwright as the cloud sessions (1.56.1): a newer Chromium reads
      # inline styles differently and backlog-visual-test saw 0 menu separators.
      - run: npm i -g playwright@1.56.1 acorn
      - run: pip install requests
      - run: playwright install --with-deps chromium
      - run: SHARD=${{ matrix.shard }}/4 bash tests/harness/run.sh

  tests:
    needs: [changes, lessons, harness]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} code=${{ needs.changes.outputs.code }} lessons=${{ needs.lessons.result }} harness=${{ needs.harness.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.lessons.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.changes.outputs.code }}" = "false" ]; then exit 0; fi
          [ "${{ needs.harness.result }}" = "success" ]
