name: "האתר לא עונה - Tapugan Safety"

# 22/10/2026 (Michael: "and what happens if the site does not work", and in the questionnaire "do it: a check
# from outside"). The watchdog in _watchdog.js runs inside the site, so a site that is down cannot report itself.
# This runs on GitHub every 15 minutes. A failed run = GitHub mails the account that owns the schedule
# (Michael's), with this workflow's name in the subject. No secret: the backup Worker has none that can send,
# and GitHub's own failure mail needs none.
#
# What it calls: the country gate (functions/_middleware.js) refuses GitHub's servers, so only paths it lets
# through from abroad: GET /api/wa-hook (machine path; without Meta's token the function itself answers 403
# "forbidden", which proves the Functions run) and GET /logo.jpg (the static files). Three tries a minute apart
# before failing, so one slow answer does not mail.
#
# WhatsApp (22/10/2026, Michael in the questionnaire: "do it: a WhatsApp alert instead"): once when the site goes
# down (the previous run passed) and once when it is back, through the approved template (any time of day, no
# 24-hour window). Needs two repository secrets Michael adds (project-files/chrome-queue.md C34):
# META_ACCESS_TOKEN (a Meta system-user token) and WA_TO (his number, 972...). The repo is public: never inline
# them. Without them the WhatsApp step says so and the failed run still mails. The phone number id is not a
# secret (plain text in Cloudflare too).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # 26/10/2026 (Michael adds the two secrets from his phone): a hand run with this on sends one test message,
    # so Claude checks the secrets work without waiting for the site to go down.
    inputs:
      test_whatsapp:
        description: 'send one WhatsApp test message'
        type: boolean
        default: false

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Site answers
        id: probe
        run: |
          site=https://tapugan-safety.pages.dev
          up=false
          for i in 1 2 3; do
            fn=$(curl -s -m 20 -w ' %{http_code}' "$site/api/wa-hook" || true)
            st=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$site/logo.jpg" || true)
            echo "try $i: functions [$fn], static [$st]"
            if [ "$fn" = "forbidden 403" ] && [ "$st" = "200" ]; then up=true; break; fi
            [ $i -lt 3 ] && sleep 60
          done
          echo "up=$up" >> "$GITHUB_OUTPUT"
          echo "detail=functions [$fn], static [$st]" >> "$GITHUB_OUTPUT"
          # 24/11/2026 (Michael: "do it: build a mail alert"): the server can answer and still not reach the database
          # (that noon a wrong SUPABASE_SERVICE_ROLE_KEY gave every call 401 and the assistant went silent for an hour).
          # /api/db-health answers "db ok" or "db fail"; only asked when the site answers, three tries a minute apart.
          db=ok
          if [ "$up" = "true" ]; then
            for i in 1 2 3; do
              dh=$(curl -s -m 20 -w ' %{http_code}' "$site/api/db-health" || true)
              echo "db try $i: [$dh]"
              if [ "$dh" = "db ok 200" ]; then db=ok; break; fi
              db=fail
              [ $i -lt 3 ] && sleep 60
            done
          fi
          echo "db=$db" >> "$GITHUB_OUTPUT"
      - name: WhatsApp on a change
        env:
          GH_TOKEN: ${{ github.token }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          WA_TO: ${{ secrets.WA_TO }}
          UP: ${{ steps.probe.outputs.up }}
          DB: ${{ steps.probe.outputs.db }}
          TEST: ${{ inputs.test_whatsapp }}
        run: |
          # the last finished scheduled run of this workflow (before this one) that passed or failed: success = was up.
          # 02/11/2026 (retro 22/10/2026 (d)): a cancelled or skipped run in between counted as "not a failure", so a
          # site still down sent "down" a second time (and "back" was never sent); those runs are skipped now.
          # Tested in tests/harness/site-up-test.py.
          runs=$(curl -s -m 20 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/site-up.yml/runs?status=completed&event=schedule&per_page=10")
          read -r prev jobs <<< "$(printf '%s' "$runs" | python3 -c "import sys,json; r=[x for x in (json.load(sys.stdin).get('workflow_runs') or []) if x.get('conclusion') in ('success','failure')]; print((r[0]['conclusion'] + ' ' + (r[0].get('jobs_url') or '-')) if r else 'none -')")"
          # 24/11/2026 (security review of #db-health): a failed run is either the site down or the database lost. Which one
          # is read from the step that failed, so a database failure does not swallow a later "site down" or send "site back".
          kind=ok
          if [ "$prev" = "failure" ]; then
            kind=site
            if [ "$jobs" != "-" ]; then
              kind=$(curl -s -m 20 -H "Authorization: Bearer $GH_TOKEN" "$jobs" | python3 -c "import sys,json; s=[st.get('name','') for j in (json.load(sys.stdin).get('jobs') or []) for st in (j.get('steps') or []) if st.get('conclusion')=='failure']; print('db' if any('database' in n for n in s) else 'site')" 2>/dev/null || echo site)
            fi
          fi
          echo "previous run: $prev ($kind), now up: $UP, db: ${DB:-ok}"
          if [ "$TEST" = "true" ]; then
            msg='בדיקה: ההתראה מ-GitHub כשהאתר לא עונה מחוברת לוואטסאפ שלך. אין צורך לענות.'
          elif [ "$UP" = "false" ]; then
            [ "$kind" = "site" ] && exit 0
            msg='האתר tapugan-safety.pages.dev לא עונה כבר כמה דקות (בדיקה מ-GitHub). הוואטסאפ, החתימה והעוזר לא יעבדו עד שיחזור. הנתונים שמורים ב-Supabase.'
          elif [ "${DB:-ok}" = "fail" ]; then
            [ "$kind" = "db" ] && exit 0
            msg='השרת לא מצליח להגיע למסד הנתונים כבר כמה דקות (בדיקה מ-GitHub). העוזר בוואטסאפ לא יענה, והודעות אליו לא יישמרו. הסיבה השכיחה: מפתח המסד ב-Cloudflare (SUPABASE_SERVICE_ROLE_KEY ב-Production).'
          elif [ "$kind" = "site" ]; then
            msg='האתר tapugan-safety.pages.dev חזר לענות (בדיקה מ-GitHub).'
          elif [ "$kind" = "db" ]; then
            msg='השרת שוב מגיע למסד הנתונים, והעוזר בוואטסאפ חזר לעבוד (בדיקה מ-GitHub). הודעות ששלחת לו בזמן התקלה לא נשמרו: לשלוח שוב.'
          else exit 0; fi
          if [ -z "$META_ACCESS_TOKEN" ] || [ -z "$WA_TO" ]; then echo "::warning::no WhatsApp secrets (C34), GitHub's mail only"; exit 0; fi
          # 26/10/2026: the assistant's number moved (#2018) to phone id 1304479066092850 (Cloudflare META_PHONE_NUMBER_ID);
          # the old 1165172413343378 answers 133010 "Account not registered". The template is the server's
          # (SITE.templates.assistant); while Meta has not approved it, a plain text goes instead, which WhatsApp
          # delivers when Michael wrote to the assistant in the last 24 hours.
          PHONE=1304479066092850
          send() { curl -s -o /tmp/wa.json -w '%{http_code}' -m 20 -X POST "https://graph.facebook.com/v25.0/$PHONE/messages" \
            -H "Authorization: Bearer $META_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$1"; }
          body=$(MSG="$msg" python3 -c "import json,os; print(json.dumps({'messaging_product':'whatsapp','to':os.environ['WA_TO'],'type':'template','template':{'name':'safety_assistant_update','language':{'code':'he'},'components':[{'type':'body','parameters':[{'type':'text','text':os.environ['MSG']}]}]}}))")
          code=$(send "$body"); echo "whatsapp template: $code"
          if [ "$code" != "200" ]; then
            head -c 300 /tmp/wa.json; echo
            text=$(MSG="$msg" python3 -c "import json,os; print(json.dumps({'messaging_product':'whatsapp','to':os.environ['WA_TO'],'type':'text','text':{'body':os.environ['MSG']}}))")
            code=$(send "$text"); echo "whatsapp text: $code"
            [ "$code" = "200" ] || { head -c 300 /tmp/wa.json; echo "::warning::WhatsApp send failed"; }
          fi
      - name: Fail when down (GitHub mails too)
        if: steps.probe.outputs.up != 'true'
        run: |
          echo "::error::tapugan-safety.pages.dev does not answer (${{ steps.probe.outputs.detail }})"
          exit 1
      - name: Fail when the server cannot reach the database (GitHub mails too)
        if: steps.probe.outputs.up == 'true' && steps.probe.outputs.db == 'fail'
        run: |
          echo "::error::the server answers but /api/db-health says db fail (check SUPABASE_SERVICE_ROLE_KEY in Cloudflare Production)"
          exit 1
