name: Daily Safety Reminders

# OFF by Michael's decision, 2026-09-19: "לא צריך כרגע שליחה, בטל את זה כרגע".
#
# The daily 09:00 digest had not actually sent since at least 2026-05-22: every
# run failed with 401 "API key is invalid" because the RESEND_KEY repository
# secret was never added, and GitHub then disabled the workflow for inactivity
# on 2026-07-29. So nothing is being lost here — the schedule is removed so it
# cannot quietly start sending again if that secret ever appears.
#
# TO TURN IT BACK ON, both steps are needed:
#   1. restore the two `schedule:` lines below
#   2. add the RESEND_KEY secret: repo -> Settings -> Secrets and variables ->
#      Actions -> New repository secret (same key as the Cloudflare env var)
# The script and its email template are untouched and still work.
on:
  # schedule:
  #   - cron: '0 6 * * *'  # 09:00 Israel time (UTC+3)
  workflow_dispatch:      # manual run only, for testing after a re-enable

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Send daily reminders
        env:
          # SUPABASE_URL + publishable key are safe to keep inline (the
          # publishable/anon key is designed for client exposure).
          SUPABASE_URL: https://znhjtpcltrxxyfjczgvw.supabase.co
          SUPABASE_KEY: sb_publishable_N2ihyyjK_qZEyB0vqunNtQ_oi4roa0M
          # RESEND_KEY is a LIVE secret — must come from GitHub Actions
          # Secrets, never inline. Set it at: repo → Settings → Secrets and
          # variables → Actions → New repository secret → name "RESEND_KEY".
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          TO_EMAIL: sviva@tapugan.co.il
        run: python3 .github/scripts/send_reminders.py
