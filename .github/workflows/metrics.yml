name: Monthly learning metrics

# Michael, 01/10/2026: "a machine that learns and grows". Once a month this
# writes last month's row into project-files/METRICS.md (first-try failures of
# `tests`, rounds until green, fix PRs, retro findings, new and recurring
# lessons) and commits it to the branch metrics/auto (below). Claude reads that file at the start
# of a session (CLAUDE.md).
#
# The commit is .md only, so it starts no deploy of the app.
# Since 04/10/2026 main requires the "tests" check. The bot is not an admin, and a
# "tests" run it starts itself (workflow_dispatch on a branch) does not count: the
# trial run on 14/10/2026 had tests green on the commit and the push was still refused
# ("Required status check tests is expected"), while the same commit as a PR opened by
# Michael's account merged once the PR run was green (#1489). So this job only pushes
# the commit to the branch metrics/auto, and the monthly compliance Routine (the 1st,
# 08:03, project-files/routine-compliance.md step 5) opens the PR and merges it.
on:
  schedule:
    - cron: '7 4 1 * *'   # the 1st of every month, 07:07 Israel time in summer
  workflow_dispatch:
    inputs:
      month:
        description: 'YYYY-MM (empty = last month)'
        required: false

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONTH: ${{ inputs.month }}
        run: python3 .github/scripts/monthly-metrics.py $MONTH
      - name: Commit
        run: |
          git -c core.quotepath=off diff --quiet -- project-files/METRICS.md && { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-files/METRICS.md
          git commit -m "Monthly metrics (automatic)"
          git push -f origin HEAD:refs/heads/metrics/auto

